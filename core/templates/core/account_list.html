{% extends 'core/base.html' %}

{% block title %}
Account List
{% endblock %}

{%block content%}

<h1 style="text-align: center; ">Accounts</h1>

<div style="display:flex; flex-direction:column; gap:20px;">
    {%for account in accounts %}
        <div class="link-box">
            <a href="{% url 'viewer_details' account.pk %}">
                Account ID: {{ account.pk}}
            </a>
        </div>
    {% empty %}
        <li>No accounts found</li>
    {% endfor %}
</div>


{% endblock %}
