{% extends "core/base.html" %}

{%block title%} Analytics {%endblock%}

{%block content%}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<container>
    <h1>Analytics</h1>
</container>

<div class="chart-grid">
    <container>
        <h3 class="chart-label-text">Churned Users by Subscription</h3>
        <div class="chart-box">
            <canvas id="chart1"></canvas>
        </div>
    </container>
    <container>
        <h3 class="chart-label-text">Average Watch Sessions Per Week by Age</h3>
        <div class="chart-box">
            <canvas id="chart2"></canvas>
        </div>
    </container>
    <container>
        <h3 class="chart-label-text">Total Revenue by Country</h3>
        <div class="chart-box">
            <canvas id="chart3"></canvas>
        </div>
    </container>
    <container>
        <h3 class="chart-label-text">Churn Rate by Country</h3>
        <div class="chart-box">
            <canvas id="chart4"></canvas>
        </div>
    </container>
</div>
<script>
    const labels = JSON.parse('{{ label|escapejs }}');
    const data = JSON.parse('{{ values|escape }}');

    new Chart(document.getElementById('chart1'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Churned Users by Subscription',
                data: data,
                backgroundColor: "#B20710"
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });
</script>
<script>
    const chart_2_labels = JSON.parse('{{ age|escapejs }}');
    const chart_2_data = JSON.parse('{{ avg_watch_session|escapejs }}');

    new Chart(document.getElementById('chart2'), {
        type: 'line',
        data: {
            labels: chart_2_labels,
            datasets: [{
                label: 'Average Watch Sessions Per Week by Age',
                data: chart_2_data,
                borderColor: "#B20710",
                backgroundColor:"#212121",
                fill: false,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });
</script>
<script>
    const chart_3_labels = JSON.parse('{{ country|safe }}');
    const chart_3_data = JSON.parse('{{ total_revenue|escapejs }}');

    new Chart(document.getElementById('chart3'), {
        type: 'bar',
        data: {
            labels: chart_3_labels,
            datasets: [{                        
                label: 'Total Revenue by Country',
                data: chart_3_data,
                backgroundColor: "#B20710"
            }]
        },
        options: {
            indexAxis: 'y',
            maintainAspectRatio: false,
            responsive: true,
        }
    });
</script>
<script>
    const chart_4_labels = JSON.parse('{{ country2|escapejs }}');
    const chart_4_data = JSON.parse('{{ churn_rate|escapejs }}');

    new Chart(document.getElementById('chart4'), {
        type: 'pie',
        data: {
            labels: chart_4_labels,
            datasets: [{                        
                label: 'Churn Rate by County',
                data: chart_4_data,
                backgroundColor: [
                   '#FF6384',
                    '#36A2EB',
                    '#FFCE56',
                    '#4BC0C0',
                    '#9966FF',
                    '#FF9F40',
                    '#8BC34A',
                    '#E91E63',
                    '#00BCD4',
                    '#CDDC39'
                ]
            }]
        },
        options: {
            indexAxis: 'y',
            maintainAspectRatio: false,
            responsive: true,
        }
    });
</script>
{% endblock %}
