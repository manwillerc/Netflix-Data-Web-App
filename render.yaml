databases:
  - name: netflixdb
    plan: free
    databaseName: netflixdb
    user: netflixwebapp

services:
  - type: web
    plan: free
    name: NetflixWebApp
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn NetflixWebApp.wsgi:application -k uvicorn.workers.UvicornWorker' 
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: netflixdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4