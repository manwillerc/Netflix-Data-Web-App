databases:
  - name: NetflixDataDatabase
    plan: free
    databaseName: netflixdatadatabase
    user: netflixdatadatabase_user

services:
  - type: web
    plan: free
    name: NetflixWebApp
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn mysite.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: NetflixDataDatabase
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4