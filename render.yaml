databases:
  - name: NetflixAnalyticsdb
    plan: free
    databaseName: NetflixAnalytics
    user: NetflixAnalytics

services:
  - type: web
    plan: free
    name: NetflixAnalytics
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn NetflixWebApp.asgi:application -k uvicorn.workers.UvicornWorker' 
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: NetflixAnalyticsdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
